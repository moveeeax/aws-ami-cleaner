name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum version from go.mod plus the latest stable release.
        go: [go.mod, stable]
    name: test (go ${{ matrix.go }})
    steps:
      - uses: actions/checkout@v7

      # The race detector needs cgo; install gcc up front so `-race` can link.
      - name: Install C toolchain (for -race)
        run: |
          set -eux
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            # build-essential brings gcc *and* libc6-dev (stdlib.h), which cgo needs.
            sudo apt-get install -y --no-install-recommends build-essential
          fi
          gcc --version

      # Minimum Go version comes straight from go.mod; "stable" tracks the latest release.
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
          cache: true

      - name: gofmt (must be clean)
        run: |
          set -eux
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race + coverage)
        env:
          CGO_ENABLED: "1"
        run: go test -race -covermode=atomic ./...
