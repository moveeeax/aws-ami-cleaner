name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The race detector needs cgo; install gcc up front so `-race` can link.
      - name: Install C toolchain (for -race)
        run: |
          set -eux
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            # build-essential brings gcc *and* libc6-dev (stdlib.h), which cgo needs.
            sudo apt-get install -y --no-install-recommends build-essential
          fi
          gcc --version

      # Go version comes straight from go.mod.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt (must be clean)
        run: |
          set -eux
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race + coverage)
        env:
          CGO_ENABLED: "1"
        run: go test -race -covermode=atomic ./...
